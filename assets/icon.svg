<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1e2e"/>
      <stop offset="100%" stop-color="#11111b"/>
    </linearGradient>
    <linearGradient id="padGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#313244"/>
      <stop offset="100%" stop-color="#181825"/>
    </linearGradient>
    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e06c75"/>
      <stop offset="50%" stop-color="#e5c07b"/>
      <stop offset="100%" stop-color="#61afef"/>
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-opacity="0.45" flood-color="#000000"/>
    </filter>
    <filter id="playShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.5" flood-color="#16a34a"/>
    </filter>
  </defs>

  <!-- Base Notepad Body -->
  <rect x="28" y="24" width="200" height="212" rx="28" fill="url(#bgGrad)" filter="url(#shadow)"/>
  <rect x="28" y="24" width="200" height="212" rx="28" fill="none" stroke="#45475a" stroke-width="2"/>

  <!-- Notepad Top Binding Header -->
  <path d="M 28 52 C 28 36.5 40.5 24 56 24 L 200 24 C 215.5 24 228 36.5 228 52 L 228 58 L 28 58 Z" fill="#24273a"/>
  <!-- Spiral Bindings -->
  <circle cx="60" cy="24" r="5" fill="#585b70" stroke="#181825" stroke-width="2"/>
  <circle cx="92" cy="24" r="5" fill="#585b70" stroke="#181825" stroke-width="2"/>
  <circle cx="128" cy="24" r="5" fill="#585b70" stroke="#181825" stroke-width="2"/>
  <circle cx="164" cy="24" r="5" fill="#585b70" stroke="#181825" stroke-width="2"/>
  <circle cx="196" cy="24" r="5" fill="#585b70" stroke="#181825" stroke-width="2"/>

  <!-- Mini Editor dots -->
  <circle cx="48" cy="42" r="4.5" fill="#f38ba8"/>
  <circle cx="64" cy="42" r="4.5" fill="#f9e2af"/>
  <circle cx="80" cy="42" r="4.5" fill="#a6e3a1"/>

  <!-- Subtle notepad lines -->
  <line x1="52" y1="80" x2="204" y2="80" stroke="#313244" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="52" y1="110" x2="204" y2="110" stroke="#313244" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="52" y1="140" x2="204" y2="140" stroke="#313244" stroke-width="1.5" stroke-dasharray="3 3"/>
  <line x1="52" y1="170" x2="204" y2="170" stroke="#313244" stroke-width="1.5" stroke-dasharray="3 3"/>

  <!-- HTML Brackets </> Symbol -->
  <g fill="none" stroke="#89b4fa" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="74,104 54,124 74,144" stroke="#f38ba8"/>
    <line x1="92" y1="148" x2="108" y2="100" stroke="#cdd6f4"/>
    <polyline points="126,104 146,124 126,144" stroke="#a6e3a1"/>
  </g>

  <!-- Big Play Button Badge in Bottom Right -->
  <g filter="url(#playShadow)">
    <circle cx="180" cy="180" r="38" fill="url(#playGrad)"/>
    <circle cx="180" cy="180" r="38" fill="none" stroke="#86efac" stroke-width="2" opacity="0.6"/>
    <!-- Play Triangle -->
    <polygon points="172,162 172,198 198,180" fill="#ffffff"/>
  </g>
</svg>
